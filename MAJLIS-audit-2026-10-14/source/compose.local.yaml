name: majlis-local
services:
  db:
    image: majlis-postgres:17
    build:
      context: ./docker
      dockerfile: Postgres.Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: majlis
      POSTGRES_USER: majlis
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD locally}
      APP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U majlis -d majlis -Atc \"SELECT 1 FROM pg_roles WHERE rolname='majlis_app'\" | grep -qx 1"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  postgres_data:
